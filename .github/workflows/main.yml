name: test

on:
  - push
  - pull_request

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.8.6
      - run: mise run setup
      - run: mise run lint
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "pypy3.11"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.8.6
      - run: mise run setup
      - name: Validate preprocessing and generated SDK contracts
        run: mise run test
  wiretap:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.8.6
      - run: mise run setup
      - name: Validate SDK calls against Wiretap
        run: mise run test:wiretap
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wiretap-validation
          path: validation-artifacts/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.8.6
      - name: Set package version from tag
        if: ${{ startsWith(github.ref, 'refs/tags/v3.') }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mise run version:set "${TAG#v}"
      - run: mise run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
  github-release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v3.') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          name: ${{ github.ref_name }}
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v3.') }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
