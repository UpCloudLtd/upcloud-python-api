name: publish-testpypi-manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "v3 alpha package version to publish (for example, 3.0.0a1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write         # required for PyPI/TestPyPI Trusted Publishers (OIDC)

jobs:
  testpypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.14
      - name: Set package version
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --locked python generator/scripts/set_version.py sdk/pyproject.toml "$VERSION"
      - run: uv build sdk --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
