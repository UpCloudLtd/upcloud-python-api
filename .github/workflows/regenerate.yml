# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Regenerate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Spec version (e.g. 1.2.3)
        required: true
        type: string
      asset_url:
        description: GitHub API URL for the spec tarball release asset
        required: true
        type: string
      spec_file:
        description: Spec filename inside the released spec tarball
        required: true
        type: string

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      UV_PYTHON: "3.14"
      SPEC_VERSION: ${{ github.event.inputs.version }}
      ASSET_URL: ${{ github.event.inputs.asset_url }}
      SPEC_FILE: ${{ github.event.inputs.spec_file || 'upcloud-public-openapi.json' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v3-dev
          fetch-depth: 1

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.8.6

      - name: Download OpenAPI Spec
        env:
          SPECS_ACCESS_PAT: ${{ secrets.SPECS_ACCESS_PAT }}
        run: mise run spec:download "$SPEC_VERSION" "$ASSET_URL" --spec-file "$SPEC_FILE"

      - name: Generate, update lockfile, and validate before creating PR
        run: mise run regenerate

      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated-sdk-validation
          path: validation-artifacts/
          if-no-files-found: ignore

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenerate SDK from spec ${{ env.SPEC_VERSION }}"
          branch: "regen/${{ env.SPEC_VERSION }}"
          title: "Regenerate SDK (${{ env.SPEC_VERSION }})"
          base: v3-dev
          body: >
            Automated regeneration for spec version
            `${{ env.SPEC_VERSION }}`.
