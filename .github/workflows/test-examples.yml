name: Test SDK Examples

on:
  pull_request:
    paths:
      - ".github/workflows/test-examples.yml"
      - ".config/mise.toml"
      - "generator/scripts/run_examples.sh"
      - "upcloud_api/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "examples/**/*.md"
  workflow_dispatch:

jobs:
  test-examples:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
      UPCLOUD_SDK_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.8.6

      - name: Setup mdtest
        uses: UpCloudLtd/mdtest/.github/actions/setup-mdtest@main
        with:
          install-go: "true"

      - name: Test File Storage API
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: mise run examples:file-storage

      - name: Test Object Storage API
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: mise run examples:object-storage

      - name: Test Tag API
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: mise run examples:tag

      - name: Test Kubernetes API
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: mise run examples:kubernetes
