name: Test SDK Examples

on:
  pull_request:
    paths:
      - ".github/workflows/test-examples.yml"
      - ".config/mise.toml"
      - "generator/scripts/run_examples.sh"
      - "upcloud_api/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "examples/**"
  workflow_dispatch:

permissions: {}

jobs:
  test-examples:
    # Fork PRs cannot read UPCLOUD_TOKEN.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mise (includes the pinned mdtest)
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.10.3

      - name: Run all live examples
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: mise run examples
