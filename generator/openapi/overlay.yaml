overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: UpCloud Python SDK spec fixes
  version: 1.0.0
# Applied by generate.sh with `speakeasy overlay apply --strict`: when upstream
# fixes a defect its target stops matching and generation fails; delete that group.
actions:
  # kubernetesDefaultStorageEncryption has allOf [$ref, {description}, {}]; the
  # generator rejects the incomplete branches. OpenAPI 3.1 allows siblings of
  # $ref, so flatten to $ref + description + x-go-type (Go hint).
  # Source fix needed: define the schema as a plain $ref with sibling description.
  - target: $.components.schemas.kubernetesDefaultStorageEncryption.allOf
    remove: true
  - target: $.components.schemas.kubernetesDefaultStorageEncryption
    update:
      description: The default storage encryption strategy for all node groups.
      x-go-type: StorageEncryption
      "$ref": "#/components/schemas/kubernetesStorageEncryption"

  # firewallRulesetErrorResponse.invalid_params is an array with properties and
  # required at the array level; move them into items.
  # Source fix needed: define the element schema under items.
  # Static copy of spec.json values; generator/tests/test_openapi_overlay.py checks drift.
  - target: $.components.schemas.firewallRulesetErrorResponse.properties.invalid_params
    update:
      items:
        type: object
        properties:
          name:
            type: string
            examples:
              - zone
              - networks.0.ip_address
            description: Path to the field with invalid parameter.
          reason:
            type: string
            examples:
              - Zone is not valid.
            description: Human-readable error message.
        required:
          - name
          - reason
  - target: $.components.schemas.firewallRulesetErrorResponse.properties.invalid_params.properties
    remove: true
  - target: $.components.schemas.firewallRulesetErrorResponse.properties.invalid_params.required
    remove: true

  # POST /1.3/kubernetes documents 201, but the API returns 200 OK, so the SDK
  # treated successful creation as an error.
  # Source fix needed: document the 200 response.
  # Static copy of the 201 response; generator/tests/test_openapi_overlay.py checks drift.
  - target: $.paths['/1.3/kubernetes'].post.responses
    update:
      "200":
        "$ref": "#/components/responses/kubernetesPostCluster"
  - target: $.paths['/1.3/kubernetes'].post.responses['201']
    remove: true

  # Wiretap uses Go's RE2 engine, which cannot compile the negative lookahead in
  # storageLabelFilter. This equivalent excludes '_' only in the first position.
  # Source fix needed: use an RE2-compatible pattern with the same language.
  - target: $.components.schemas.storageLabelFilter
    update:
      pattern: '^[\x20-\x3C\x3E-\x5E\x60-\x7E][\x20-\x3C\x3E-\x7E]{1,31}(?:=.*)?$'

  # OpenAPI 3.1 expresses nullable strings as a type union, not `nullable`.
  # Remove/re-add object nodes because Overlay cannot remove primitive-valued keys.
  # Source fix needed: use type [string, null].
  - target: $.components.schemas.kubernetesPrefixedClaimOrExpression.properties.prefix
    remove: true
  - target: $.components.schemas.kubernetesPrefixedClaimOrExpression.properties
    update:
      prefix:
        type:
          - string
          - "null"
        description: "Prefix prepended to the claim's value. Must be set (may be empty) when claim is set. Mutually exclusive with expression.\n"
        example: "oidc:"
  - target: $.components.schemas.gatewayLabelValue
    remove: true
  - target: $.components.schemas.firewallRulesetLabelValue
    remove: true
  - target: $.components.schemas
    update:
      gatewayLabelValue:
        type:
          - string
          - "null"
        examples:
          - production
          - backend
          - web-app
          - backup
          - engineering
        title: Label value
        maxLength: 255
        pattern: '\A[\p{L}\p{N}\p{P}\p{S}\p{M}\p{Z}]*\z'
        description: The value of a label.
      firewallRulesetLabelValue:
        type:
          - string
          - "null"
        examples:
          - production
          - backend
          - web-app
          - backup
          - engineering
        title: Label Value
        maxLength: 255
        pattern: '\A[\p{L}\p{N}\p{P}\p{S}\p{M}\p{Z}]*\z'
        description: Schema for a label value property, allowing a string or null with specific character constraints.

  # The original CIDR suffix matches the literal text "0-32", rejecting valid CIDRs.
  # Source fix needed: constrain the suffix to the numeric range 0 through 32.
  - target: $.components.schemas.kubernetesIPBlock
    update:
      pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}(/([0-9]|[12][0-9]|3[0-2]))?$'

  # The bare object branch overlaps every valid storage backup schedule.
  # Source fix needed: make the empty-object branch accept only an empty object.
  - target: $.components.schemas.createStorageRequest.properties.storage.properties.backup_rule.oneOf[1]
    update:
      maxProperties: 0
  - target: $.components.schemas.modifyStorageBody.properties.storage.properties.backup_rule.oneOf[1]
    update:
      maxProperties: 0
  - target: $.components.schemas.storageDetails.properties.backup_rule.oneOf[1]
    update:
      maxProperties: 0

  # These empty pseudo-properties are schema keywords accidentally nested as model fields.
  # Source fix needed: move type/required/additionalProperties to the schema object.
  - target: $.components.schemas.accountResourceLimits.properties.type
    remove: true
  - target: $.components.schemas.accountResourceLimits.properties.required
    remove: true
  - target: $.components.schemas.accountResourceLimits.properties.additionalProperties
    remove: true
